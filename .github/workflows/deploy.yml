name: Deploy to Debian Server

on:
  push:
    branches:
      - deploy 

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy qua SSH vào Debian
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_SSH_PORT }}
          script: |
            set -e
            echo "=== ĐANG CẬP NHẬT MÃ NGUỒN TRÊN DEBIAN ==="
            cd /home/debian/courson-deploy

            # 1. Kéo code mới nhất từ nhánh deploy
            git fetch origin deploy
            git reset --hard origin/deploy

            # 2. Build lại image mới và khởi chạy container
            docker compose down web-app
            docker compose up -d --build

            # 3. Dọn dẹp các Docker image cũ không còn dùng để tiết kiệm ổ cứng
            docker image prune -f
            
            echo "=== TRIỂN KHAI THÀNH CÔNG ==="