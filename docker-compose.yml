services:
  postgres-db:
    image: postgres:16-alpine
    container_name: swp391_local_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: sa
      POSTGRES_DB: courson_db
    ports:
      - "5433:5432" # Chỉ mở cổng DB ra ngoài máy thật nếu muốn dùng DBeaver soi dữ liệu.
    volumes:
      - pgdata_local:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-init-tables.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed-data.sql:ro
    networks:
      - courson-net

  web-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: swp391_local_web
    restart: unless-stopped
    depends_on:
      - postgres-db
    ports:
      - "8080:8080" # Truy cập web local tại http://localhost:8080
    environment:
      - DB_URL=jdbc:postgresql://postgres-db:5432/courson_db
      - DB_USER=postgres
      - DB_PASSWORD=sa
    networks:
      - courson-net

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: swp391_tunnel
    restart: unless-stopped
    depends_on:
      - web-app
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - courson-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
      
volumes:
  pgdata_local:

networks:
  courson-net:
    driver: bridge